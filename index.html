<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CADIT Resource Hub</title>
<style>
:root {
  --ink: #163247;
  --muted: #526b7a;
  --paper: #f0f9ff;
  --card: #ffffff;
  --line: #bae6fd;
  --accent: #0284c7;
  --accent-soft: #e0f2fe;
  --navy: #123b5d;
  --navy2: #1b5f85;
  --blue: #38bdf8;
  --sky: #7dd3fc;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e8f4fa;
    --muted: #a3bbc9;
    --paper: #0e1722;
    --card: #15212e;
    --line: #273f50;
    --accent: #38bdf8;
    --accent-soft: #16364a;
    --navy: #071b30;
    --navy2: #103b5c;
    --blue: #38bdf8;
    --sky: #7dd3fc;
  }
}

/* Global */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.55 "Segoe UI", system-ui, sans-serif;
}

.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

/* Header */
.top {
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  border-bottom: 4px solid var(--sky);
  color: #ffffff;
  padding-top: 18px;
}

.brandrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 14px; }

.logo { height: 38px; background: #ffffff; padding: 4px 8px; border-radius: 4px; }

.logo-text {
  background: #ffffff;
  color: var(--navy);
  font-weight: 800;
  letter-spacing: 0.04em;
  padding: 6px 12px;
  border-radius: 4px;
}

.brand-sep { width: 1px; height: 30px; background: rgba(255, 255, 255, 0.35); }

.top h1 { margin: 0; color: #ffffff; font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; }

/* Subtitle only (nested lists now use .sublist) */
.sub { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.top .sub { color: #c7e7fa; font-size: 0.9rem; }

/* Search (with icon) */
.search { position: relative; display: block; }
.top .search { flex: 1 1 320px; max-width: 520px; }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.top .search-icon { color: #c7e7fa; }

.search input {
  width: 100%;
  max-width: 520px;
  padding: 10px 14px 10px 38px;
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
}

.top .search input {
  min-width: 280px;
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.35);
}

.top .search input::placeholder { color: #c7e7fa; }
.search input:focus { border-color: var(--sky); }

.search input:focus,
.tab:focus-visible,
a:focus-visible,
button:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--sky);
  outline-offset: 2px;
}

.sr { position: absolute; left: -9999px; }

/* Navigation tabs */
#tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }

.tab {
  font: inherit;
  font-weight: 600;
  color: #c7e7fa;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 10px 18px;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: #ffffff; }
.tab[aria-selected="true"] { color: #ffffff; border-bottom-color: var(--sky); }
.top .tab:focus-visible { outline-color: #ffffff; }

.cnt { margin-left: 4px; font: 0.75rem ui-monospace, Consolas, monospace; opacity: 0.7; }

/* Main content */
main { padding-top: 28px; padding-bottom: 40px; outline: 0; }

.intro { color: var(--muted); margin: 16px 0 24px; max-width: 70ch; }
.partner-label { margin: 28px 0 4px; font-size: 1.05rem; }
.band { margin: 32px 0 12px; font-size: 1.1rem; }
.band small { font: 0.8rem ui-monospace, Consolas, monospace; color: var(--muted); font-weight: 400; margin-left: 8px; }

/* Resource groups */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

.group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.group:hover { border-color: var(--sky); box-shadow: 0 3px 12px rgba(56, 189, 248, 0.08); }
.group h3 { margin: 0 0 4px; font-size: 1.05rem; }
.group .note { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li { border-top: 1px solid var(--line); padding: 8px 0; }
.group a { color: var(--accent); font-weight: 600; text-decoration: none; }
.group a:hover { color: var(--blue); text-decoration: underline; }
.group h3 a.all { color: var(--ink); text-decoration: underline; text-decoration-color: var(--sky); text-underline-offset: 3px; }
.group h3 a.all:hover { color: var(--accent); }
.group .desc { display: block; color: var(--muted); font-size: 0.88rem; }

.todo {
  display: inline-block;
  margin-left: 8px;
  padding: 0 8px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 10px;
}

.empty { color: var(--muted); padding: 24px 0; }
li.empty { color: var(--muted); font-size: 0.9rem; border-top: 0; }

/* Buttons */
.btn {
  display: inline-block;
  padding: 8px 16px;
  font-weight: 600;
  color: #ffffff;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.btn:hover { background: var(--navy2); border-color: var(--navy2); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.pending { background: var(--card); color: var(--ink); border: 1px dashed var(--line); }

@media (prefers-color-scheme: dark) {
  .btn { color: #071b30; }
  .btn:hover { color: #ffffff; }
  .btn.pending { color: var(--ink); }
}

/* Notices */
.notice {
  margin: 0 0 20px;
  padding: 12px 16px;
  background: var(--accent-soft);
  border-left: 4px solid var(--sky);
  border-radius: 4px;
  max-width: 80ch;
}

.title { font-weight: 600; }

/* Expandable sections (nested list is .sublist, not .sub) */
summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 2px 0; }
details > .desc { margin-top: 2px; }

.sublist {
  margin: 8px 0 0 14px !important;
  padding-left: 12px !important;
  border-left: 2px solid var(--sky);
}
.sublist li { border-top: 0 !important; padding: 4px 0 !important; }
.own a { font-weight: 400 !important; text-decoration: underline !important; }

/* Resource cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 28px; }

.card {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  text-decoration: none;
}
a.card:hover { border-color: var(--sky); }
.card strong { display: block; color: var(--accent); }
.card.pending strong { color: var(--ink); }
.card .desc { margin-top: 2px; }

/* Home hero */
.hero {
  margin-top: 32px;
  background: linear-gradient(135deg, var(--card) 0%, var(--accent-soft) 100%);
  border: 1px solid var(--line);
  border-left: 6px solid var(--sky);
  border-radius: 10px;
  padding: 28px 32px;
  margin-bottom: 8px;
}
.hero .date { margin: 0; font: 0.8rem ui-monospace, Consolas, monospace; letter-spacing: 0.12em; color: var(--muted); }
.hero h2 { margin: 6px 0; font-size: 2.4rem; color: var(--navy); }
.hero p:last-child { margin: 0; color: var(--muted); max-width: 60ch; }
@media (prefers-color-scheme: dark) { .hero h2 { color: #e8f4fa; } }

/* Home cards */
.hcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }

.hcard {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.hcard:hover { border-color: var(--sky); box-shadow: 0 2px 10px rgba(56, 189, 248, 0.15); }
.hcard > a { display: block; padding: 14px 40px 14px 16px; color: var(--ink); text-decoration: none; height: 100%; }
.hcard strong { display: block; color: var(--ink); }
.hcard .desc, .pcard .desc, .panel .desc { display: block; color: var(--muted); font-size: 0.88rem; }

/* Tags */
.tag {
  display: inline-block;
  margin-bottom: 8px;
  padding: 1px 8px;
  font: 0.7rem ui-monospace, Consolas, monospace;
  letter-spacing: 0.08em;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 3px;
}

/* Pin buttons */
.pin { position: absolute; top: 10px; right: 10px; background: none; border: 0; font-size: 1.1rem; color: var(--muted); cursor: pointer; line-height: 1; }
.pin:hover, .pin[aria-pressed="true"] { color: #e0a100; }

/* Chips (Home departments and Ansys sections) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

.chip {
  font: inherit;
  font-weight: 600;
  padding: 6px 16px;
  color: var(--accent);
  background: var(--card);
  border: 1px solid var(--sky);
  border-radius: 20px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { color: #ffffff; background: var(--accent); border-color: var(--accent); }
@media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { color: #071b30; background: var(--accent); } }

/* Two-column layout */
.duo { display: grid; grid-template-columns: 1fr 1.5fr; gap: 16px; margin-top: 32px; align-items: start; }
@media (max-width: 760px) { .duo { grid-template-columns: 1fr; } }

/* Panels */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
.panel h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 1.05rem; }
.panel h3 span { font: 0.8rem ui-monospace, Consolas, monospace; color: var(--muted); }

.pinlist, .notices { list-style: none; margin: 0; padding: 0; }
.pinlist li { padding: 6px 0; border-top: 1px solid var(--line); }
.pinlist a { color: var(--accent); font-weight: 600; text-decoration: none; }
.notices li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.notices li:first-child, .pinlist li:first-child { border-top: 0; }

.ntag {
  flex: none;
  align-self: flex-start;
  padding: 1px 8px;
  font: 0.7rem ui-monospace, Consolas, monospace;
  letter-spacing: 0.08em;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 3px;
}
.notices p { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }

/* Partner cards: flex column so every title sits at the same height */
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }

.pcard {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 4px solid var(--sky);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pcard:hover { border-color: var(--sky); box-shadow: 0 2px 10px rgba(56, 189, 248, 0.12); }
.pcard strong { display: block; font-size: 1.15rem; padding-right: 40px; }
.pcount { position: absolute; top: 16px; right: 16px; font: 0.8rem ui-monospace, Consolas, monospace; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 12px; }
.pill { font: 0.72rem ui-monospace, Consolas, monospace; padding: 2px 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }

/* Footer */
.foot { color: var(--muted); font-size: 0.85rem; padding-bottom: 32px; }

</style>
</head>

const tabsEl = document.getElementById("tabs");
const content = document.getElementById("content");
const search = document.getElementById("q");
const parts = (location.hash || "#home").slice(1).split("/");
let active = (parts[0] === "home" || HUB.some(p => p.id === parts[0])) ? parts[0] : "home";
let section = parts[1] || "";

function esc(s){ return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function linkHTML(it){
  if (!it.url) return `<span class="title">${esc(it.title)}</span>`;
  return it.url === "#"
    ? `<span class="title">${esc(it.title)}</span><span class="todo">link to add</span>`
    : `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
}

function itemHTML(it, open){
  const desc = it.desc ? `<span class="desc">${esc(it.desc)}</span>` : "";
  if (it.children && it.children.length) {
    const kids = it.children.map(c => `<li>${linkHTML(c)}${c.desc ? `<span class="desc">${esc(c.desc)}</span>` : ""}</li>`).join("");
    const own = (it.url && it.url !== "#") ? `<li class="own"><a href="${esc(it.url)}" target="_blank" rel="noopener">Open on website</a></li>` : "";
    return `<li><details${open ? " open" : ""}><summary>${esc(it.title)}</summary>${desc}<ul class="sublist">${own}${kids}</ul></details></li>`;
  }
  return `<li>${linkHTML(it)}${desc}</li>`;
}

function groupHTML(g, items, open){
  return `<section class="group"><h3>${esc(g.name)}</h3>${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}<ul>${items.map(i => itemHTML(i, open)).join("")}</ul></section>`;
}

function cardHTML(it){
  const inner = `<strong>${esc(it.title)}</strong>${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : ""}`;
  if (!it.url) return `<div class="card pending">${inner}</div>`;
  if (it.url === "#") return `<div class="card pending">${inner}<span class="todo">link to add</span></div>`;
  return `<a class="card" href="${esc(it.url)}" target="_blank" rel="noopener">${inner}</a>`;
}

function cardsHTML(block){
  return `<h2 class="band">${esc(block.title)}</h2><div class="cards">${block.items.map(cardHTML).join("")}</div>`;
}

// every group of a partner, for search (plain groups, featured cards, sections, other cards)
function partnerGroups(p){
  const out = [];
  if (p.featured) out.push({ g: { name: p.featured.title, items: p.featured.items }, ctx: p.name });
  (p.groups || []).forEach(g => out.push({ g, ctx: p.name }));
  (p.sections || []).forEach(s => s.groups.forEach(g => out.push({ g, ctx: p.name + " " + s.name })));
  if (p.other) out.push({ g: { name: p.other.title, items: p.other.items }, ctx: p.name });
  return out;
}

/* ---------------- HOME TAB ---------------- */
function store(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function keep(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let dept = store("hubDept", HOME.depts[0].id);
let pins = store("hubPins", []);

function countItems(p){
  return partnerGroups(p).reduce((n, x) => n + x.g.items.reduce((m, i) => m + 1 + (i.children ? i.children.length : 0), 0), 0);
}
function allHomeItems(){
  return HOME.quick.items.concat(...HOME.depts.map(d => d.items));
}
function hcardHTML(it){
  const on = pins.includes(it.url);
  return `<div class="hcard"><a href="${esc(it.url)}" target="_blank" rel="noopener"><span class="tag">${esc(it.tag || "PAGE")}</span><strong>${esc(it.title)}</strong><span class="desc">${esc(it.desc)}</span></a><button class="pin" data-pin="${esc(it.url)}" aria-pressed="${on}" aria-label="Pin ${esc(it.title)}" title="Pin">&#9733;</button></div>`;
}
function homeHTML(){
  const now = new Date(), h = now.getHours();
  const hello = h < 12 ? "Good morning!" : h < 18 ? "Good afternoon!" : "Good evening!";
  const date = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).toUpperCase();
  const d = HOME.depts.find(x => x.id === dept) || HOME.depts[0];
  const pinned = allHomeItems().filter((it, i, a) => pins.includes(it.url) && a.findIndex(z => z.url === it.url) === i);
  const total = HUB.reduce((n, p) => n + countItems(p), 0);
  const chips = HOME.depts.map(x => `<button class="chip" data-dept="${x.id}" aria-pressed="${x.id === d.id}">${esc(x.name)}</button>`).join("");
  const notices = HOME.notices.map(n => `<li><span class="ntag">${esc(n.tag)}</span><div><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p></div></li>`).join("");
  const partners = HUB.map(p => {
    const tags = (p.sections || p.groups || []).slice(0, 4).map(x => `<span class="pill">${esc(x.name)}</span>`).join("");
    return `<button class="pcard" data-go="${p.id}"><span class="pcount">${countItems(p)}</span><strong>${esc(p.name)}</strong><span class="desc">${esc(p.intro)}</span><span class="pills">${tags}</span></button>`;
  }).join("");
  return `<section class="hero"><p class="date">${date}</p><h2>${hello}</h2><p>${esc(HOME.hero)}</p></section>
  <h2 class="band">${esc(HOME.quick.title)} <small>${esc(HOME.quick.note)}</small></h2>
  <div class="hcards">${HOME.quick.items.map(hcardHTML).join("")}</div>
  <h2 class="band">For your department</h2>
  <div class="chips" role="group" aria-label="Department">${chips}</div>
  <div class="hcards">${d.items.map(hcardHTML).join("")}</div>
  <div class="duo">
    <section class="panel"><h3>Your pins <span>${pinned.length}</span></h3>${pinned.length
      ? `<ul class="pinlist">${pinned.map(it => `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a><span class="desc">${esc(it.desc)}</span></li>`).join("")}</ul>`
      : `<p class="desc">Star any resource above and it stays here for you. Pins are saved in this browser only.</p>`}</section>
    <section class="panel"><h3>Notices <span>${HOME.notices.length}</span></h3><ul class="notices">${notices}</ul></section>
  </div>
  <h2 class="band">Partners <small>${total} resources</small></h2>
  <div class="pcards">${partners}</div>`;
}

// q = current search text. While searching, no tab is marked as selected.
function renderTabs(q){
  const on = id => !q && id === active;
  const homeTab = `<button class="tab" role="tab" aria-selected="${on("home")}" data-id="home">Home</button>`;
  tabsEl.innerHTML = homeTab + HUB.map(p => `<button class="tab" role="tab" aria-selected="${on(p.id)}" data-id="${p.id}">${esc(p.name)} <span class="cnt">${countItems(p)}</span></button>`).join("");
}

function matches(text, q){ return String(text || "").toLowerCase().includes(q); }

function filterItems(items, q, ctx){
  const out = [];
  items.forEach(it => {
    const self = matches(it.title + " " + it.desc + " " + ctx, q);
    const kids = (it.children || []).filter(c => matches(c.title + " " + c.desc, q));
    if (self) out.push(it);
    else if (kids.length) out.push(Object.assign({}, it, { children: kids }));
  });
  return out;
}

// Ansys-style sections: chips, first section open by default, no repeated heading
function sectionHTML(p){
  const s = (p.sections || []).find(x => x.id === section) || p.sections[0];
  const title = p.sectionsTitle || "Explore";
  const chips = p.sections.map(x => `<button class="chip" data-sec="${esc(x.id)}" aria-pressed="${x.id === s.id}">${esc(x.name)}</button>`).join("");
  return `<h2 class="band">${esc(title)}</h2><div class="chips" role="group" aria-label="${esc(title)}">${chips}</div>`
    + `<div class="secbody">${s.intro ? `<p class="intro">${esc(s.intro)}</p>` : ""}<div class="groups">${s.groups.map(g => groupHTML(g, g.items, false)).join("")}</div></div>`;
}

function render(){
  const q = search.value.trim().toLowerCase();
  renderTabs(q);
  if (!q && active === "home") { content.innerHTML = homeHTML(); return; }
  if (!q) {
    const p = HUB.find(x => x.id === active);
    const homeLinks = [].concat(p.home || [], p.homeExtra || []);
    const home = homeLinks.length ? `<p class="btns">${homeLinks.map(h => h.url === "#"
      ? `<span class="btn pending">${esc(h.title)} <span class="todo">link to add</span></span>`
      : `<a class="btn" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a>`).join("")}</p>` : "";
    const notice = p.notice ? `<p class="notice">${esc(p.notice)}</p>` : "";
    let body;
    if (p.sections) {
      body = (p.featured ? cardsHTML(p.featured) : "") + sectionHTML(p) + (p.other ? cardsHTML(p.other) : "");
    } else {
      body = (p.featured ? cardsHTML(p.featured) : "")
        + `<div class="groups">${p.groups.map(g => groupHTML(g, g.items, false)).join("")}</div>`;
    }
    content.innerHTML = `<p class="intro">${esc(p.intro)}</p>${home}${notice}${body}`;
    return;
  }
  let html = "", found = 0;
  HUB.forEach(p => {
    const hits = partnerGroups(p).map(x => ({ g: x.g, items: filterItems(x.g.items, q, x.ctx + " " + x.g.name) })).filter(x => x.items.length);
    if (hits.length) { found++; html += `<h2 class="partner-label">${esc(p.name)}</h2><div class="groups">${hits.map(h => groupHTML(h.g, h.items, true)).join("")}</div>`; }
  });
  content.innerHTML = found ? html : `<p class="empty">No resources match "${esc(q)}". Try a shorter word or clear the search.</p>`;
}

tabsEl.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  active = b.dataset.id; section = ""; location.hash = active; search.value = ""; render();
});
// Section chips (Ansys tab): always one open, no toggle-off
content.addEventListener("click", e => {
  const b = e.target.closest("[data-sec]"); if (!b) return;
  section = b.dataset.sec;
  location.hash = active + "/" + section; render();
});
// Home tab clicks: department chips, pins, partner cards
content.addEventListener("click", e => {
  const c = e.target.closest("[data-dept]");
  if (c) { dept = c.dataset.dept; keep("hubDept", dept); render(); return; }
  const p = e.target.closest("[data-pin]");
  if (p) { const u = p.dataset.pin; pins = pins.includes(u) ? pins.filter(x => x !== u) : pins.concat(u); keep("hubPins", pins); render(); return; }
  const g = e.target.closest("[data-go]");
  if (g) { active = g.dataset.go; section = ""; location.hash = active; render(); window.scrollTo(0, 0); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
});
search.addEventListener("input", render);
render();
